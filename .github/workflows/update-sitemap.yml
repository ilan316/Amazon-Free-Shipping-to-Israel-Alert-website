name: Update Sitemap

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'blog/**.html'
  workflow_dispatch:

concurrency:
  group: sitemap-update
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Commit updated sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # sitemap.xml is a fully generated artifact — never rebase/merge it
          # (concurrent runs regenerate the whole file, so a rebase always
          # conflicts). Instead, on each attempt reset to the freshest
          # origin/main, regenerate on top of it, and push. Deterministic
          # from the file tree, so this can never conflict.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node generate-sitemap.js
            git add sitemap.xml
            if git diff --cached --quiet; then
              echo "No sitemap changes to commit."
              exit 0
            fi
            git commit -m "chore: auto-update sitemap"
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push failed on attempt $i, retrying against fresh origin/main..."
          done
          echo "::error::Failed to push sitemap after 5 attempts."
          exit 1
