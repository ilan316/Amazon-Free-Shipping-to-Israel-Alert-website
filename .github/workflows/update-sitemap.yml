name: Update Sitemap

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'blog/**.html'
      - 'tools/category-map.json'
      - 'tools/build-internal-links.js'
  workflow_dispatch:

concurrency:
  group: sitemap-update
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    # This job now commits .html files too, which would normally re-trigger the
    # workflow — but pushes made with GITHUB_TOKEN never trigger workflow runs,
    # so there is no loop. (The rebuild is idempotent regardless.)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # generate-sitemap.js גוזר lastmod מתאריך ה-commit האחרון של כל קובץ.
          # checkout רדוד (ברירת המחדל, depth=1) היה מחזיר commit אחד בלבד וכל
          # הקבצים היו מקבלים את תאריך הריצה — בדיוק הבאג שתוקן.
          fetch-depth: 0

      - name: Rebuild internal links and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Both scripts are fully generated artifacts — never rebase/merge them
          # (concurrent runs regenerate the whole output, so a rebase always
          # conflicts). Instead, on each attempt reset to the freshest
          # origin/main, regenerate on top of it, and push. Deterministic
          # from the file tree, so this can never conflict.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # מצלמים את המצב הקודם לפני הבנייה — משמש בשלב ההתראה כדי לשלוח
            # רק אזהרות *חדשות* ולא לספם על אותו פוסט בכל ריצה.
            cp blog/categories.json "$RUNNER_TEMP/prev-categories.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/prev-categories.json"
            node tools/build-internal-links.js
            node generate-sitemap.js
            git add -A
            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi
            git commit -m "chore: auto-update internal links + sitemap"
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push failed on attempt $i, retrying against fresh origin/main..."
            # הפבלישר דוחף עשרות קומיטים ב-burst של ~20 שניות. בלי השהייה כל
            # חמשת הניסיונות נדחסים ל-13 שניות, מפסידים את המרוץ ומדליקים X
            # אדום מיותר. backoff לינארי פורש אותם על ~60 שניות ומוציא אותם
            # מחלון ה-burst. (ריצה שנכשלת בכל זאת תמיד מתוקנת ע"י הריצה
            # שנדלקת מהדחיפה האחרונה — הבנייה דטרמיניסטית.)
            if [ "$i" -lt 5 ]; then
              sleep $((i * 5))
            fi
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1

      # סקירה שלא נכנסה לשום קטגוריה נשארת ב"שונות" עם קישורי "מוצרים דומים"
      # לא רלוונטיים. שולחים על כך מייל לאדמינים דרך הבאקאנד — רק על אזהרות
      # חדשות, כדי שהריצה הבאה לא תשלח שוב את אותו דבר.
      - name: Alert on unclassified reviews
        env:
          INTERNAL_SYNC_SECRET: ${{ secrets.INTERNAL_SYNC_SECRET }}
          # variable, לא secret — ה-URL אינו סודי. אם לא הוגדר, ה-shell נופל
          # לברירת המחדל https://app.amzfreeil.com
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e '
            const fs = require("fs");
            const read = (p) => { try { return JSON.parse(fs.readFileSync(p, "utf8")).warnings || []; } catch { return []; } };
            const prev = new Set(read(process.env.RUNNER_TEMP + "/prev-categories.json"));
            const fresh = read("blog/categories.json").filter((w) => !prev.has(w));
            fs.writeFileSync(process.env.RUNNER_TEMP + "/payload.json", JSON.stringify({ warnings: fresh, run_url: process.env.RUN_URL }));
            console.log(`אזהרות חדשות: ${fresh.length}`);
            fresh.forEach((w) => console.log("::warning::" + w));
          '
          if [ "$(node -pe 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/payload.json","utf8")).warnings.length')" = "0" ]; then
            echo "אין אזהרות חדשות — לא נשלח מייל."
            exit 0
          fi
          curl -sS -f -X POST "${API_BASE_URL:-https://app.amzfreeil.com}/internal/hub-warnings" \
            -H "Content-Type: application/json" \
            -H "X-Sync-Secret: $INTERNAL_SYNC_SECRET" \
            --data-binary "@$RUNNER_TEMP/payload.json" \
            || echo "::warning::שליחת ההתראה נכשלה (הבאקאנד לא זמין?)"
