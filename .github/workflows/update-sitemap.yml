name: Update Sitemap

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'blog/**.html'
  workflow_dispatch:

concurrency:
  group: sitemap-update
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Generate sitemap
        run: node generate-sitemap.js

      - name: Commit updated sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "No sitemap changes to commit."
            exit 0
          fi
          git commit -m "chore: auto-update sitemap"
          # Push can lose a race if main moves between rebase and push
          # (concurrent human pushes aren't in this workflow's concurrency group).
          # Retry: re-fetch, rebase, push again.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push failed on attempt $i, re-syncing with origin/main..."
            git pull --rebase origin main
          done
          echo "::error::Failed to push sitemap after 5 attempts."
          exit 1
