<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Footer Preview</title>
<style>
  body { margin: 0; font-family: Heebo, sans-serif; background: #f5f5f5; display: flex; justify-content: center; padding: 40px 16px; }

  /* מדמה מסך מובייל */
  .phone {
    width: 375px;
    background: #fffaf1;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }

  footer {
    padding: 10px 16px 16px;
  }

  .footer-topbar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
    padding: 14px 16px;
    border: 1px solid rgba(23,32,51,0.12);
    border-radius: 14px;
    background: rgba(255,255,255,0.92);
  }

  /* שורה 1: כותרת + לוגו */
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: Rubik, sans-serif;
    font-weight: 700;
    font-size: 1rem;
    color: #172033;
    white-space: nowrap;
  }
  .brand img {
    width: 28px;
    height: 28px;
    border-radius: 8px;
  }

  /* שורה 2: קישורי ניווט */
  .footer-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 14px;
  }
  .footer-links a {
    color: #4d5a70;
    text-decoration: none;
    font-size: 0.88rem;
    font-weight: 500;
    white-space: nowrap;
  }

  /* שורה 3: רשתות חברתיות */
  .footer-social {
    display: flex;
    gap: 18px;
    justify-content: center;
  }
  .footer-social a {
    color: #4d5a70;
    text-decoration: none;
    font-size: 0.88rem;
    font-weight: 500;
  }

  .footer-copy {
    text-align: center;
    color: #4d5a70;
    font-size: 0.78rem;
    margin: 12px 0 0;
  }

  .label {
    font-size: 0.7rem;
    color: #999;
    text-align: center;
    margin: 4px 0 0;
    direction: ltr;
  }
</style>
</head>
<body>
<div class="phone">
  <footer>
    <div class="footer-topbar">

      <!-- שורה 1: כותרת -->
      <a class="brand" href="index.html">
        <img src="logo-new.png" alt="לוגו" onerror="this.style.background='#ff9900';this.style.width='28px';this.style.height='28px';this.removeAttribute('src')">
        <span>AMZ Free Ship Alert</span>
      </a>

      <!-- שורה 2: קישורי ניווט -->
      <div class="footer-links">
        <a href="#">מדיניות פרטיות</a>
        <a href="#">תנאי שימוש</a>
        <a href="#">אודות</a>
        <a href="#">גילוי נאות</a>
      </div>

      <!-- שורה 3: סושיאל -->
      <div class="footer-social">
        <a href="#">פייסבוק</a>
        <a href="#">אינסטגרם</a>
      </div>

    </div>
    <p class="footer-copy">© 2026 AMZ Free Ship Alert · אין לאתר זה כל זיקה, שותפות או שיוך ל-Amazon Inc</p>
  </footer>
</div>
</body>
</html>
